[package]
name = "linalloc"
version = "3.0.0"
edition = "2024"
rust-version = "1.100"
description = """
A fixed-capacity bump allocator backed by virtual memory.
"""
license = "MIT"
repository = "https://github.com/qaijuang/linalloc"
keywords = ["arena", "bump", "allocator", "linear", "memory"]
categories = ["memory-management"]
exclude = [
    ".github",
    "rustfmt.toml",
    ".gitignore",
    "benches",
    "rust-toolchain.toml",
]

[dependencies]
linalloc-sys = { version = "0.1.0", path = "./linalloc-sys" }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "lib"
harness = false
